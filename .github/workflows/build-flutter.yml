- name: Extract source
  run: |
    mkdir -p source
    curl -fL -o source.zip "https://github.com/kelvinkelivin11-blip/Bot-bulid/releases/download/build-8558349800-1792045500891/BaseXakataV4.1.zip"
    unzip -q source.zip -d source

- name: Detect Flutter project
  run: |
    FILE=$(find "$GITHUB_WORKSPACE/source" \
      -name pubspec.yaml -type f -print -quit)

    if [ -z "$FILE" ]; then
      echo "ERROR: pubspec.yaml tidak ditemukan."
      echo "Isi ZIP:"
      find source -maxdepth 3 -type f | head -100
      exit 1
    fi

    echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV": 1
